<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme and language before first paint; dark unless the visitor chose light. -->
    <script>try{var t=localStorage.getItem('firesight.org.theme'),l=localStorage.getItem('firesight.org.lang')}catch(e){}var d=document.documentElement;d.dataset.theme=t==='light'?'light':'dark';if(l==='ar'){d.lang='ar';d.dir='rtl'}</script>
    <meta name="description" content="Firesight for Organizations: every site you answer for on one map, ranked each morning by live NASA satellite fires, fire danger and 25 years of fire history." />
    <link rel="icon" href="/org/favicon.svg" type="image/svg+xml" />
    <title>Firesight for Organizations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
